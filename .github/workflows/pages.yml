name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Collect site files
        run: |
          mkdir _site
          cp -r index.html assets _site/
          # Stamp every local CSS/JS URL with the commit so a new page never pairs with stale cached files.
          v="${GITHUB_SHA::8}"
          sed -i -E "s#(assets/[^\"?]+\.(css|js))\"#\1?v=$v\"#g" _site/index.html
          grep -q "style.css?v=$v" _site/index.html && grep -q "app.js?v=$v" _site/index.html && grep -q "tokens.css?v=$v" _site/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
