<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Portrait Coach</title>
<meta name="description" content="See your reference photo over the camera view and trace it onto paper.">
<meta name="theme-color" content="#14120f">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>

<main class="stage" id="stage">
  <video id="cam" playsinline muted autoplay hidden></video>
  <img id="photo" alt="Reference photo" hidden>

  <div class="empty" id="empty">
    <button class="btn primary big" id="pickBtn" type="button">Choose a photo</button>
    <p>or drop / paste one here. It stays on your device.</p>
  </div>

  <div class="level" id="level" hidden>
    <div class="dial" aria-hidden="true"><span class="ring"></span><span class="bubble" id="bubble"></span></div>
    <b id="levelDeg" aria-live="polite">0.0°</b>
    <button class="chip" id="calBtn" type="button" title="Lay the phone flat on your paper, then tap">Calibrate</button>
    <button class="chip" id="calReset" type="button" hidden title="Level against a flat table again">Reset</button>
  </div>
</main>

<nav class="bar" id="bar">
  <button class="chip" id="photoBtn" type="button">Photo</button>
  <button class="chip" id="camBtn" type="button" aria-pressed="false">Camera</button>
  <label class="see" for="see"><span>See-through</span><input type="range" id="see" min="0" max="100" step="5" value="50"></label>
  <button class="chip" id="lockBtn" type="button" aria-pressed="false" title="Stop accidental moves while you trace">Lock</button>
</nav>

<input type="file" id="fileInput" accept="image/*" hidden>
<div class="toast" id="toast" role="status"></div>
<script src="assets/app.js"></script>
</body>
</html>
