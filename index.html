<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Portrait Coach</title>
<meta name="description" content="Crop a reference photo, see it in tones, and trace it onto paper through your camera.">
<meta name="theme-color" content="#14120f">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>

<!-- Step 1: crop to a shape and adjust -->
<section class="screen" id="prep">
  <main class="stage" id="prepStage">
    <img id="src" alt="Photo being cropped" hidden>
    <div class="shade" id="shade" hidden></div>
    <div class="frame" id="frame" hidden></div>
    <div class="empty" id="empty">
      <button class="btn primary big" id="pickBtn" type="button">Choose a photo</button>
      <p>or drop / paste one here. It stays on your device.</p>
      <p class="or">or start with a sample</p>
      <div class="samples" id="samples"></div>
      <button class="chip" id="cancelPick" type="button" hidden>Cancel</button>
    </div>
  </main>
  <div class="panel" id="prepPanel" hidden>
    <label class="slider" for="bright"><span>Brightness</span><input type="range" id="bright" min="50" max="150" step="1"><output id="brightOut"></output></label>
    <label class="slider" for="contrast"><span>Contrast</span><input type="range" id="contrast" min="50" max="200" step="1"><output id="contrastOut"></output></label>
    <div class="row">
      <div class="seg" id="ratios" role="radiogroup" aria-label="Crop shape">
        <button type="button" role="radio" data-ratio="1:1">1:1</button>
        <button type="button" role="radio" data-ratio="4:5">4:5</button>
        <button type="button" role="radio" data-ratio="3:4">3:4</button>
        <button type="button" role="radio" data-ratio="2:3">2:3</button>
        <button type="button" role="radio" data-ratio="A4">A4</button>
      </div>
      <button class="chip" id="turnBtn" type="button" aria-pressed="false">Landscape</button>
    </div>
    <div class="row">
      <button class="chip" id="bwBtn" type="button" aria-pressed="true">B&amp;W</button>
      <button class="chip" id="adjReset" type="button">Reset</button>
      <span class="grow"></span>
      <button class="chip" id="changeBtn" type="button">New photo</button>
      <button class="btn primary" id="doneBtn" type="button">Done</button>
    </div>
  </div>
</section>

<!-- Step 2: see-through tracing -->
<section class="screen" id="trace" hidden>
  <main class="stage" id="stage">
    <video id="cam" playsinline muted autoplay hidden></video>
    <canvas id="photo" aria-label="Reference photo"></canvas>
    <div class="level" id="level" hidden>
      <div class="dial" aria-hidden="true"><span class="ring"></span><span class="bubble" id="bubble"></span></div>
      <b id="levelDeg" aria-live="polite">0.0°</b>
      <button class="chip" id="calBtn" type="button" title="Lay the phone flat on your paper, then tap">Calibrate</button>
      <button class="chip" id="calReset" type="button" hidden title="Level against a flat table again">Reset</button>
    </div>
  </main>
  <nav class="panel" aria-label="Tracing">
    <div class="row">
      <button class="chip" id="editBtn" type="button">Edit</button>
      <button class="chip" id="camBtn" type="button" aria-pressed="false">Camera</button>
      <select class="chip" id="blend" aria-label="Blend with camera" title="How the photo mixes with the camera view">
        <option value="normal">Normal</option>
        <option value="multiply">Multiply</option>
        <option value="darken">Darken</option>
        <option value="color-burn">Colour burn</option>
        <option value="overlay">Overlay</option>
        <option value="soft-light">Soft light</option>
        <option value="screen">Screen</option>
        <option value="difference">Difference</option>
      </select>
      <label class="slider" for="see"><span>See-through</span><input type="range" id="see" min="0" max="100" step="5"></label>
    </div>
    <div class="row">
      <button class="chip" id="toneBack" type="button" aria-label="Previous tone step">←</button>
      <span class="step" id="toneStep" aria-live="polite"></span>
      <button class="chip" id="toneNext" type="button" aria-label="Next tone step">→</button>
      <div class="dots" id="toneDots" aria-hidden="true"></div>
    </div>
  </nav>
</section>

<input type="file" id="fileInput" accept="image/*" hidden>
<div class="toast" id="toast" role="status"></div>
<script src="assets/app.js"></script>
</body>
</html>
